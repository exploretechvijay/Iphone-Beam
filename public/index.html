<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090b12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beam">
  <title>Beam</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/icon.svg" alt=""><span>Beam</span></div>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
    <button class="btn ghost" id="connectBtn" type="button">
      <span class="i"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM18 14h2.5M14 18v2.5"/></svg></span>
      <span class="label">Connect a device</span>
    </button>
  </header>

  <main class="layout">
    <section class="room" aria-label="Devices on your Wi-Fi">
      <div class="radar" id="radar">
        <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="waves" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="radar-hint" id="radarHint">Looking for devices…</div>
        <div class="me">
          <div id="meAvatar"></div>
          <button class="me-name" id="meName" type="button" title="Rename this device"></button>
          <div class="me-sub" id="meSub"></div>
        </div>
        <div id="peers"></div>
      </div>
      <p class="room-tip" id="roomTip"></p>
    </section>

    <aside class="activity" aria-label="Activity">
      <div class="activity-head">
        <h2>Activity</h2>
        <button class="link" id="clearBtn" type="button" hidden>Clear</button>
      </div>
      <div class="feed" id="feed"></div>
      <div class="empty" id="feedEmpty"></div>
    </aside>
  </main>

  <!-- Choose what to send -->
  <div class="overlay" id="sheet" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Send to device">
      <div class="sheet-peer" id="sheetPeer"></div>
      <button class="sheet-btn" id="sendFilesBtn" type="button">
        <span class="ic"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-5-5L5 21"/></svg></span></span>
        <span><strong>Photos, videos &amp; files</strong><small>Pick from your library or files</small></span>
      </button>
      <button class="sheet-btn" id="sendTextBtn" type="button">
        <span class="ic"><span class="i"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span></span>
        <span><strong>Text or link</strong><small>Send a note, address or URL</small></span>
      </button>
      <button class="btn ghost block" type="button" data-close>Cancel</button>
    </div>
  </div>

  <!-- Send text -->
  <div class="overlay" id="textModal" hidden>
    <form class="modal" id="textForm" role="dialog" aria-modal="true" aria-labelledby="textTitle">
      <h3 id="textTitle">Send text to <span id="textTarget"></span></h3>
      <p class="sub">Paste a link, a note, an OTP — anything.</p>
      <textarea class="field" id="textInput" rows="5" placeholder="Type or paste here…" required autofocus></textarea>
      <div class="modal-actions">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn" type="submit">Send</button>
      </div>
    </form>
  </div>

  <!-- Rename -->
  <div class="overlay" id="renameModal" hidden>
    <form class="modal" id="renameForm" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
      <h3 id="renameTitle">Name this device</h3>
      <p class="sub">This is how other devices in the room will see you.</p>
      <input class="field" id="nameInput" maxlength="40" autocomplete="off" required autofocus>
      <div class="modal-actions">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn" type="submit">Save</button>
      </div>
    </form>
  </div>

  <!-- Connect another device -->
  <div class="overlay" id="connectModal" hidden>
    <div class="modal center" role="dialog" aria-modal="true" aria-label="Connect a device">
      <div id="connectBody"></div>
      <div class="modal-actions"><button class="btn ghost block" type="button" data-close>Done</button></div>
    </div>
  </div>

  <div class="drop-hint" id="dropHint"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" class="sr-only" multiple tabindex="-1" aria-hidden="true">

  <script src="/app.js"></script>
</body>
</html>
